name: Build Android APK

# Se puede lanzar manualmente desde la pestaña "Actions" en GitHub
# (botón "Run workflow"), y opcionalmente cada vez que se sube código
# a main. Quita el bloque "push" si solo quieres lanzarlo a mano.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Generar proyecto nativo (expo prebuild)
        run: npx expo prebuild --platform android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: ojamatching-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14